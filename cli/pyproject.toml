[project]
name = "metrace-cli"
version = "0.1.0"
description = "Command line client for metrace (device-flow login, trace, shipments, incidents)"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.17",
  "httpx>=0.28",
]

[project.scripts]
metrace = "metrace_cli.main:app"

[dependency-groups]
dev = ["pytest>=8.4"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["metrace_cli"]

[tool.pytest.ini_options]
markers = ["e2e: needs the running stack and a token (METRACE_TOKEN)"]
