# Development/CI only: publish internal services on 127.0.0.1 so integration
# tests on the host can reach them. Use via `make dev-ports` / `make test-integration`.
services:
  postgres:
    ports: ["127.0.0.1:5432:5432"]
  keycloak:
    ports: ["127.0.0.1:8080:8080"]
  flowable:
    ports: ["127.0.0.1:8081:8080"]
