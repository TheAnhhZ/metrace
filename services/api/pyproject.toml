[project]
name = "metrace-api"
version = "0.0.0"
description = "metrace domain API and outbox worker"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.118",
  "uvicorn>=0.37",
  "pydantic-settings>=2.10",
  "pyjwt[crypto]>=2.10",
  "httpx>=0.28",
  "sqlalchemy>=2.0.40",
  "alembic>=1.16",
  "psycopg[binary]>=3.2",
  "boto3>=1.40",
  "filetype>=1.2",
  "python-multipart>=0.0.20",
  "pyyaml>=6.0",
  "segno>=1.6",
  "reportlab>=4.4",
]

[dependency-groups]
dev = [
  "pytest>=8.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: needs the compose stack (postgres, keycloak, apisix, flowable)",
]
