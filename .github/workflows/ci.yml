name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: ruff
        run: |
          uvx ruff@0.16.10 check .
          uvx ruff@0.16.10 format --check .
      - name: reuse lint
        run: uvx --from 'reuse[charset-normalizer]==6.2.0' reuse lint
      - name: gitleaks (CLI, MIT; scans full history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks git --config .gitleaks.toml --redact --verbose .
      - name: make init writes a valid .env (clean-machine path)
        run: scripts/check-dev-secrets.sh

  unit-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: pytest (unit)
        working-directory: services/api
        run: uv run --python 3.12 pytest -m "not integration"

  cli-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: pytest (CLI unit)
        working-directory: cli
        run: uv run --python 3.12 pytest -m "not e2e"

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: no CC-BY caniuse-lite in the dependency tree
        run: bash scripts/check-caniuse-lite.sh

  licenses:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      # npm packages are read from package-lock.json: no install needed, same result on every OS.
      - name: license inventory (fails outside the allow-list)
        run: scripts/generate-license-inventory.sh
      - name: declaration is up to date
        run: git diff --exit-code docs/license-declaration.md docs/license-declaration.csv
