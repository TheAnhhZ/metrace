#
# Clean machine proof: fresh volumes, `make init`, full stack, smoke + integration tests.
name: compose-smoke

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 19 * * *" # nightly, 02:17 Asia/Ho_Chi_Minh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: make init (random secrets)
        run: |
          make init
          # Small readings bucket so the 429 test runs without 1000+ requests.
          sed -i 's/^RATE_LIMIT_READINGS_PER_MIN=.*/RATE_LIMIT_READINGS_PER_MIN=5/' .env
      - name: start stack (fresh volumes, CI-only test client)
        run: KC_OVERLAYS=test docker compose -f compose.yaml -f compose.dev-ports.yaml up -d --build --wait --wait-timeout 900
      - name: smoke
        run: scripts/smoke-core.sh
      - name: integration tests
        run: make test-integration
      - name: CLI end to end
        working-directory: cli
        run: set -a && source ../.env && set +a && uv run --python 3.12 pytest -m e2e
      - name: second start is idempotent (one-shots re-run cleanly)
        run: |
          KC_OVERLAYS=test docker compose -f compose.yaml -f compose.dev-ports.yaml up -d --wait --wait-timeout 300
          scripts/smoke-core.sh
      - name: demo start removes the CI client
        run: |
          docker compose -f compose.yaml -f compose.dev-ports.yaml up -d --wait --wait-timeout 300
          set -a; source .env; set +a
          code=$(curl -s -X POST http://localhost:9080/auth/realms/metrace/protocol/openid-connect/token \
            -d grant_type=password -d client_id=metrace-test -d username=qa-lan \
            --data-urlencode "password=$DEMO_USER_PASSWORD" | jq -r .error)
          test "$code" = "invalid_client"
      - name: logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
