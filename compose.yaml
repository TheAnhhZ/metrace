#
# Headless core (Tier 1): Keycloak (SSO), APISIX (gateway), PostgreSQL +
# SeaweedFS (data), Flowable REST (workflow). Run `make init` first.
# Only the gateway is published, and only on 127.0.0.1.
name: metrace

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    <<: *defaults
    image: postgres:17-bookworm
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make init}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?run make init}
      FLOWABLE_DB_PASSWORD: ${FLOWABLE_DB_PASSWORD:?run make init}
      METRACE_MIGRATOR_PASSWORD: ${METRACE_MIGRATOR_PASSWORD:?run make init}
      METRACE_APP_PASSWORD: ${METRACE_APP_PASSWORD:?run make init}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d metrace"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 384m

  keycloak:
    <<: *defaults
    build: ./infra/keycloak
    image: metrace/keycloak:26.8.0
    environment:
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?run make init}
      # One public origin: tokens always carry iss=http://localhost:9080/auth/...
      KC_HOSTNAME: http://localhost:9080/auth
      # Back-channel calls (JWKS, token) from inside docker use the request host.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?run make init}
      JAVA_OPTS_KC_HEAP: -Xms256m -Xmx512m
      # Placeholders resolved by the realm import (no secret in git).
      METRACE_API_CLIENT_SECRET: ${METRACE_API_CLIENT_SECRET:?run make init}
      SENSOR_GATEWAY_CLIENT_SECRET: ${SENSOR_GATEWAY_CLIENT_SECRET:?run make init}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:?run make init}
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "bash", "/opt/keycloak/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    mem_limit: 1g

  flowable:
    <<: *defaults
    image: flowable/flowable-rest:8.0.0
    # Spring Boot env names: dots -> underscores, dashes removed, upper case.
    environment:
      SPRING_DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/flowable
      SPRING_DATASOURCE_USERNAME: flowable
      SPRING_DATASOURCE_PASSWORD: ${FLOWABLE_DB_PASSWORD:?run make init}
      FLOWABLE_REST_APP_ADMIN_USERID: rest-admin
      FLOWABLE_REST_APP_ADMIN_PASSWORD: ${FLOWABLE_ADMIN_PASSWORD:?run make init}
      FLOWABLE_REST_APP_ADMIN_FIRSTNAME: Rest
      FLOWABLE_REST_APP_ADMIN_LASTNAME: Admin
      FLOWABLE_ASYNCEXECUTORACTIVATE: "true"
      JAVA_OPTS: -Xms256m -Xmx512m
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null \"http://rest-admin:$${FLOWABLE_REST_APP_ADMIN_PASSWORD}@127.0.0.1:8080/flowable-rest/service/management/engine\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    mem_limit: 768m

  # One-shot: organizations + memberships + overlays (KC_OVERLAYS), idempotent.
  kc-bootstrap:
    build: ./services/api
    image: metrace/api:dev
    command: ["python", "-m", "app.bootstrap.keycloak_bootstrap"]
    restart: "no"
    environment:
      KC_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?run make init}
      KC_OVERLAYS: ${KC_OVERLAYS:-}
    volumes:
      - ./infra/keycloak/realm-metrace.json:/srv/keycloak/realm-metrace.json:ro
      - ./infra/keycloak/overlays:/srv/keycloak/overlays:ro
    depends_on:
      keycloak: { condition: service_healthy }
    healthcheck:
      disable: true

  seaweedfs:
    <<: *defaults
    image: chrislusf/seaweedfs:4.48
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?run make init}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?run make init}
    # S3 identity is written from env at start, so no secret lives in the repo.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"metrace","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=512 -volume.max=0 -s3 -s3.config=/tmp/s3.json
    volumes:
      - seaweed:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && wget -q -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/'"]
      interval: 5s
      timeout: 3s
      retries: 30
    mem_limit: 512m

  # One-shot: alembic upgrade (schema owner role) + S3 bucket. Idempotent.
  migrate:
    build: ./services/api
    image: metrace/api:dev
    command: ["sh", "-c", "alembic upgrade head && python -m app.bootstrap.storage_bootstrap"]
    restart: "no"
    environment: &app-env
      MIGRATOR_DATABASE_URL: postgresql+psycopg://metrace_migrator:${METRACE_MIGRATOR_PASSWORD:?run make init}@postgres:5432/metrace
      DATABASE_URL: postgresql+psycopg://metrace_app:${METRACE_APP_PASSWORD:?run make init}@postgres:5432/metrace
      S3_ENDPOINT_URL: http://seaweedfs:8333
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?run make init}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?run make init}
      FLOWABLE_URL: http://flowable:8080/flowable-rest
      FLOWABLE_PASSWORD: ${FLOWABLE_ADMIN_PASSWORD:?run make init}
      OIDC_ISSUER: http://localhost:9080/auth/realms/metrace
      OIDC_JWKS_URL: http://keycloak:8080/auth/realms/metrace/protocol/openid-connect/certs
      OIDC_AUDIENCE: metrace-api
      BUSINESS_TZ: Asia/Ho_Chi_Minh
    depends_on:
      postgres: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }
    healthcheck:
      disable: true

  api:
    <<: *defaults
    build: ./services/api
    image: metrace/api:dev
    environment:
      <<: *app-env
      MIGRATOR_DATABASE_URL: ""
    depends_on:
      keycloak: { condition: service_healthy }
      kc-bootstrap: { condition: service_completed_successfully }
      migrate: { condition: service_completed_successfully }
    mem_limit: 256m

  # Outbox worker: the only component that calls Flowable.
  worker:
    <<: *defaults
    build: ./services/api
    image: metrace/api:dev
    command: ["python", "-m", "app.worker.main"]
    environment:
      <<: *app-env
      MIGRATOR_DATABASE_URL: ""
      BPMN_DIR: /srv/workflows/bpmn
    volumes:
      - ./workflows/bpmn:/srv/workflows/bpmn:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
      flowable: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker.heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 256m

  # Static SPA (placeholder until the web app is scaffolded).
  web:
    <<: *defaults
    image: nginx:1.29-bookworm
    volumes:
      - ./infra/web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/web/placeholder:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 64m

  apisix:
    <<: *defaults
    image: apache/apisix:3.19.0-debian
    environment:
      METRACE_API_CLIENT_SECRET: ${METRACE_API_CLIENT_SECRET:?run make init}
      RATE_LIMIT_API_PER_MIN: ${RATE_LIMIT_API_PER_MIN:-600}
      RATE_LIMIT_READINGS_PER_MIN: ${RATE_LIMIT_READINGS_PER_MIN:-1200}
    volumes:
      - ./infra/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./infra/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    ports:
      - "127.0.0.1:9080:9080"
    depends_on:
      keycloak: { condition: service_healthy }
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    healthcheck:
      # No curl in the image: any HTTP answer on :9080 means nginx is serving.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9080 && printf 'GET / HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q HTTP/"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 384m

volumes:
  pgdata:
  seaweed:
