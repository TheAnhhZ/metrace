#
# Single public origin: http://localhost:9080
#   /auth/*  -> Keycloak, ALLOWLIST only (everything else under /auth => 404)
#   /api/*   -> FastAPI, JWT verified here (JWKS) and again in the API
#   /*       -> static web app
upstreams:
  - id: keycloak
    type: roundrobin
    nodes:
      "keycloak:8080": 1
  - id: api
    type: roundrobin
    nodes:
      "api:8000": 1
  - id: web
    type: roundrobin
    nodes:
      "web:80": 1

routes:
  - id: auth-allowlist
    priority: 10
    uris:
      - /auth/realms/metrace/protocol/openid-connect/*
      - /auth/realms/metrace/.well-known/*
      - /auth/realms/metrace/login-actions/*
      - /auth/realms/metrace/device
      - /auth/realms/metrace/device/*
      - /auth/resources/*
    upstream_id: keycloak
    plugins:
      request-id:
        include_in_response: true

  # Everything else under /auth is denied explicitly, so it never falls
  # through to the SPA catch-all below.
  - id: auth-deny
    priority: 5
    uri: /auth/*
    plugins:
      fault-injection:
        abort:
          http_status: 404
          body: "Not Found\n"

  # Sensor readings get their own bucket so bursts never starve /api/*.
  - id: api-sensor-readings
    priority: 20
    uri: /api/v1/assets/*
    vars:
      - ["uri", "~~", "^/api/v1/assets/[^/]+/readings$"]
    upstream_id: api
    plugins:
      request-id:
        include_in_response: true
      openid-connect: &oidc
        client_id: metrace-api
        client_secret: $ENV://METRACE_API_CLIENT_SECRET
        discovery: http://keycloak:8080/auth/realms/metrace/.well-known/openid-configuration
        bearer_only: true
        use_jwks: true
        ssl_verify: false
      limit-count:
        count: ${{RATE_LIMIT_READINGS_PER_MIN}}
        time_window: 60
        key_type: var
        key: http_authorization
        rejected_code: 429
        policy: local

  - id: api
    priority: 0
    uri: /api/*
    upstream_id: api
    plugins:
      request-id:
        include_in_response: true
      openid-connect: *oidc
      limit-count:
        count: ${{RATE_LIMIT_API_PER_MIN}}
        time_window: 60
        key_type: var
        key: http_authorization
        rejected_code: 429
        policy: local

  # Static web app (lowest priority catch-all).
  - id: web
    priority: -10
    uri: /*
    upstream_id: web
#END
