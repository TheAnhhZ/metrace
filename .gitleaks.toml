# Default gitleaks rules plus an allowlist for documented placeholders.
title = "metrace gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Placeholders and generated examples"
regexes = ['''CHANGE_ME''']
paths = ['''\.env\.example$''']
