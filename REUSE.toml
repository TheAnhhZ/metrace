# SPDX-License-Identifier: Apache-2.0
#
# Files that cannot carry an SPDX header comment (JSON, lock files, binaries)
# are declared here. Everything else carries its own header.
version = 1

[[annotations]]
path = [
  "**/*.json",
  "**/*.lock",
  "**/uv.lock",
  "**/package-lock.json",
  "**/*.png",
  "**/*.svg",
  "**/*.ico",
  "**/py.typed",
  "**/.gitkeep",
  ".github/pull_request_template.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "The metrace Authors"
SPDX-License-Identifier = "Apache-2.0"
